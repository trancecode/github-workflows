name: Documentation Audit

on:
  workflow_call:
    inputs:
      audit-tasks:
        description: >-
          Markdown checklist of what to review, one numbered item per document
          area. This is the genuinely per-repository part: which documents
          exist and what "current" means for each.
        type: string
        required: false
        default: |
          1. **README.md**:
             - Verify setup and usage instructions match the current code
             - Update examples if outdated

          2. **Process Documentation** (`CLAUDE.md`):
             - Verify workflows described match current practice
             - Check for contradictions or inconsistencies

          3. **Other documentation** (any `doc/**` or `*.md` files):
             - Verify content matches current implementation state
             - Remove entries that have been implemented or are no longer relevant
             - Verify links to PRs/issues are still valid
      no-updates-summary:
        description: >-
          Bullet list used in the "no updates needed" closing template. Should
          mirror the areas listed in audit-tasks.
        type: string
        required: false
        default: |
          - README: Setup and usage instructions are current
          - Process documentation: Workflows match current practice
          - Other documentation: Content matches implementation state
      pr-threshold:
        description: >-
          Open an audit when this many claude-labelled pull requests have
          merged since the last one. Scheduled and manual runs always audit.
        type: number
        required: false
        default: 10

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  check-audit-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Determine if audit is needed
        id: check
        uses: actions/github-script@v7
        env:
          PR_THRESHOLD: ${{ inputs.pr-threshold }}
        with:
          script: |
            const audits = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'documentation,claude',
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });

            const lastAuditDate = audits.data.length > 0
              ? new Date(audits.data[0].created_at)
              : new Date(0);

            console.log(`Last audit: ${lastAuditDate.toISOString()}`);

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              base: 'main',
              sort: 'updated',
              direction: 'desc',
              per_page: 100
            });

            const mergedPRs = prs.data.filter(pr =>
              pr.merged_at &&
              new Date(pr.merged_at) > lastAuditDate &&
              pr.labels.some(l => l.name === 'claude')
            );

            const threshold = Number(process.env.PR_THRESHOLD);
            const shouldTrigger =
              mergedPRs.length >= threshold ||
              context.eventName === 'schedule' ||
              context.eventName === 'workflow_dispatch';

            console.log(`Merged PRs with 'claude' label since last audit: ${mergedPRs.length}`);
            console.log(`Threshold: ${threshold}, event: ${context.eventName}`);
            console.log(`Should trigger audit: ${shouldTrigger}`);

            return shouldTrigger;

      - name: Create audit issue
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v7
        env:
          # Passed through the environment rather than interpolated into the
          # script: the prose is arbitrary markdown and a stray backtick or
          # ${ would otherwise break the template literal.
          AUDIT_TASKS: ${{ inputs.audit-tasks }}
          NO_UPDATES_SUMMARY: ${{ inputs.no-updates-summary }}
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const fence = '```';
            const footer = '✨ Content generated by Claude AI.';

            const body = [
              '## Documentation Audit',
              '',
              'This is an automated periodic audit to ensure documentation stays synchronized with the codebase.',
              '',
              '### Audit Tasks',
              '',
              'Review the following documentation and update as needed:',
              '',
              process.env.AUDIT_TASKS.trimEnd(),
              '',
              '### Completion Criteria',
              '',
              '- **If updates are needed:** Create a PR with the `claude` and `documentation` labels containing the updates',
              '- **If no updates are needed:** Close this issue with a comment explaining that the audit found no necessary updates',
              '',
              '### Output Format',
              '',
              'When closing this issue (either because updates were made in a PR, or no updates were needed):',
              '',
              '**If updates made:**',
              fence,
              'Completed documentation audit. Found [N] items requiring updates:',
              '',
              '- [Brief description of update 1]',
              '- [Brief description of update 2]',
              '',
              'Created PR #XXX with the updates.',
              '',
              '---',
              footer,
              fence,
              '',
              '**If no updates needed:**',
              fence,
              'Completed documentation audit. All documentation is up to date:',
              '',
              process.env.NO_UPDATES_SUMMARY.trimEnd(),
              '',
              'No updates required.',
              '',
              '---',
              footer,
              fence,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Documentation Audit Checkpoint - ${today}`,
              labels: ['claude', 'documentation'],
              body: body
            });

            console.log('Created documentation audit issue');
