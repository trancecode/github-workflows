# This workflow will triage pull requests and apply labels based on the
# paths that are modified in the pull request.
#
# Configuration is stored in each calling repository's .github/labeler.yml.
# actions/labeler fails when that file is missing, so only add the stub to a
# repository that has one.
# For more information, see: https://github.com/actions/labeler

name: Labeler

on:
  workflow_call:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
