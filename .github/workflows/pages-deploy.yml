name: Pages Deploy

on:
  workflow_call:
    inputs:
      generator:
        description: >-
          Built-in documentation generator: `doc2go`, `gopages`, `pkgsite`, or
          `none`. Presets exist so a new repository gets docs on Pages without
          writing any shell. Use `build-command` for anything else.
        type: string
        required: false
        default: 'none'
      package:
        description: >-
          Import path documented by the `pkgsite` generator, for example
          github.com/trancecode/ecs/ecs. Ignored by the other generators.
        type: string
        required: false
        default: ''
      path:
        description: >-
          Directory to publish. Ignored unless `generator` is `none`, since
          each preset publishes its own output directory.
        type: string
        required: false
        default: '.'
      build-command:
        description: >-
          Shell run before the upload, to produce `path`. Left empty the
          directory is published as-is, which is what a repository serving
          static files wants. `PAGES_BASE_URL` is exported from
          actions/configure-pages, since some doc generators need it.
        type: string
        required: false
        default: ''
      go-version-file:
        description: >-
          Set up Go from this file before building. Left empty Go is not
          installed at all, so a non-Go repository pays nothing.
        type: string
        required: false
        default: ''
      system-packages:
        description: Space-separated apt packages needed by the build.
        type: string
        required: false
        default: ''
      require-pages-enabled:
        description: >-
          Check that Pages is actually enabled and exit cleanly if not, rather
          than failing the run. Useful where Pages is enabled per repository
          rather than as a rule.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.pages-check.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub Pages is enabled
        id: pages-check
        if: inputs.require-pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Pages is not enabled for this repository; skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system packages
        if: inputs.system-packages != '' && steps.pages-check.outputs.skipped != 'true'
        run: |
          sudo apt-get update
          # Deliberately unquoted: the input is a space-separated package list.
          # shellcheck disable=SC2086
          sudo apt-get install -y ${{ inputs.system-packages }}

      - name: Set up Go
        if: inputs.go-version-file != '' && steps.pages-check.outputs.skipped != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          check-latest: true
          cache: true

      # Runs before the build so generators that need the published URL, such
      # as gopages -base, can read it from PAGES_BASE_URL.
      - name: Configure Pages
        id: pages
        if: steps.pages-check.outputs.skipped != 'true'
        uses: actions/configure-pages@v5

      - name: Generate docs (doc2go)
        if: inputs.generator == 'doc2go' && steps.pages-check.outputs.skipped != 'true'
        run: |
          go install go.abhg.dev/doc2go@latest
          # Always generate from main so the published output is idempotent
          # regardless of which ref triggered the run.
          git fetch origin main
          git checkout origin/main
          mkdir -p docs/packages
          doc2go -out docs/packages ./...
          mkdir -p pages-content
          cp -r docs pages-content/
          [ -d html ] && cp -r html pages-content/ || true

      - name: Generate docs (gopages)
        if: inputs.generator == 'gopages' && steps.pages-check.outputs.skipped != 'true'
        run: go run github.com/johnstarich/go/gopages@latest -base "${{ steps.pages.outputs.base_url }}"

      - name: Generate docs (pkgsite)
        if: inputs.generator == 'pkgsite' && steps.pages-check.outputs.skipped != 'true'
        env:
          PKG: ${{ inputs.package }}
        run: |
          if [ -z "$PKG" ]; then
            echo "generator: pkgsite requires the 'package' input"
            exit 1
          fi
          go install golang.org/x/pkgsite/cmd/pkgsite@latest
          "$(go env GOPATH)/bin/pkgsite" -http=localhost:8080 . &
          PID=$!
          # Wait for the server to answer for our package.
          for _ in $(seq 1 60); do
            curl -sf "http://localhost:8080/$PKG" >/dev/null && break
            sleep 1
          done
          mkdir -p site
          wget --recursive --level=4 --no-parent --convert-links --page-requisites \
               --adjust-extension --execute robots=off --no-host-directories \
               --directory-prefix=site "http://localhost:8080/$PKG" || true
          kill "$PID" 2>/dev/null || true
          # Root redirect to the package page, and disable Jekyll so pkgsite's
          # static asset directories are served as-is.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./%s.html"><a href="./%s.html">documentation</a>\n' "$PKG" "$PKG" > site/index.html
          touch site/.nojekyll

      - name: Build
        if: inputs.build-command != '' && steps.pages-check.outputs.skipped != 'true'
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: ${{ inputs.build-command }}

      - name: Resolve publish directory
        id: publish
        if: steps.pages-check.outputs.skipped != 'true'
        run: |
          case '${{ inputs.generator }}' in
            doc2go)  dir=pages-content ;;
            gopages) dir=dist ;;
            pkgsite) dir=site ;;
            *)       dir='${{ inputs.path }}' ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing $dir"

      - name: Upload artifact
        if: steps.pages-check.outputs.skipped != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publish.outputs.dir }}

  deploy:
    needs: build
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # The Pages deploy API is intermittently flaky; one retry clears it.
      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
