name: Go Build and Test

# Static analysis deliberately lives in go-analysis.yml, not here. Running
# go vet in both meant every push vetted twice, the same duplication
# herve-quiroz/nrg#248 called out when it moved the race detector out of
# Code Analysis.

on:
  workflow_call:
    inputs:
      system-packages:
        description: >-
          Space-separated apt packages needed to build and test. Ebitengine
          repositories need the X11, OpenGL and ALSA headers plus xvfb;
          headless libraries need nothing.
        type: string
        required: false
        default: ''
      go-version-file:
        description: File the Go version is read from.
        type: string
        required: false
        default: 'go.mod'
      go-cache:
        description: >-
          Cache the Go build and module directories. Turn off for a module
          with no third-party dependencies: setup-go warns on every run
          because there is no go.sum to key the cache on.
        type: boolean
        required: false
        default: true
      ignore-paths:
        description: >-
          Space-separated pathspecs whose changes alone do not warrant running
          analysis, for example "*.md LICENSE docs/**". Left empty, analysis
          always runs.

          This is deliberately NOT workflow-level `paths-ignore`. A workflow
          skipped by a path filter reports no status at all, so a required
          status check stays Pending forever and the pull request can never
          merge. A job skipped by `if:` reports `skipped`, which satisfies a
          required check. Same saving, without the deadlock.
        type: string
        required: false
        default: ''
      build-target:
        description: Package pattern passed to go build.
        type: string
        required: false
        default: './...'
      goflags:
        description: >-
          GOFLAGS for the build. `-buildvcs=false` avoids a VCS stamping
          failure when the checkout is not a full clone.
        type: string
        required: false
        default: '-buildvcs=false'
      test-command:
        description: >-
          Command that runs the tests. Repositories whose tests open a window
          or a GL context wrap this in `xvfb-run -a`.
        type: string
        required: false
        default: 'go test -v ./...'
      pre-test-command:
        description: Optional command run after the build, before the tests.
        type: string
        required: false
        default: ''
      post-test-command:
        description: Optional command run after the tests.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether a build is warranted
        id: decide
        env:
          IGNORE: ${{ inputs.ignore-paths }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -u
          if [ -z "${IGNORE// /}" ]; then
            echo "No ignore-paths configured; running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push)         base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *) echo "Event $EVENT has no diff to inspect; running."
               echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # An initial push has an all-zeros before SHA, which is not a rev.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base revision; running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Let git do the matching. If excluding the ignored pathspecs leaves
          # nothing, every change was ignorable.
          excl=""
          for p in $IGNORE; do excl="$excl :(exclude)$p"; done
          # shellcheck disable=SC2086
          remaining=$(git diff --name-only "$base" "$head" -- . $excl)
          if [ -z "$remaining" ]; then
            echo "Only ignorable paths changed; skipping the build."
            git diff --name-only "$base" "$head" | sed 's/^/  /'
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Files warranting a build:"
            echo "$remaining" | sed 's/^/  /'
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        if: inputs.system-packages != ''
        run: |
          sudo apt-get update
          # Deliberately unquoted: the input is a space-separated package list.
          # shellcheck disable=SC2086
          sudo apt-get install -y ${{ inputs.system-packages }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: ${{ inputs.go-cache }}

      - name: Build
        env:
          GOFLAGS: ${{ inputs.goflags }}
        run: go build -v ${{ inputs.build-target }}

      - name: Pre-test
        if: inputs.pre-test-command != ''
        env:
          CI: 'true'
        run: ${{ inputs.pre-test-command }}

      - name: Test
        env:
          # Set by the runner anyway, but several repositories set it
          # explicitly and their tests branch on it, so make it contractual.
          CI: 'true'
        run: ${{ inputs.test-command }}

      - name: Post-test
        if: inputs.post-test-command != ''
        env:
          CI: 'true'
        run: ${{ inputs.post-test-command }}
